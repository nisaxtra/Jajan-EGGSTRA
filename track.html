<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacak Pesanan - EGGSTRA</title>
<style>
  :root {
    --amber: #b5701a;
    --amber-light: #fdf3e3;
    --amber-border: #eecf9a;
    --text: #3d3226;
    --text-muted: #7a6f5f;
    --green: #2f7d4f;
    --green-light: #e6f4ec;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #faf7f0;
    color: var(--text);
    margin: 0;
    padding: 0 0 60px;
  }
  header {
    background: var(--amber-light);
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--amber-border);
  }
  header h1 { margin: 0 0 4px; font-size: 24px; }
  header p { margin: 0; color: var(--text-muted); font-size: 15px; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .card {
    background: #fff; border: 1px solid #eee2cf; border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid #ddd; border-radius: 10px;
  }
  .btn-submit {
    width: 100%; padding: 14px; margin-top: 12px;
    background: var(--amber); color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .hasil-card { border-left: 5px solid var(--amber); }
  .status-pill {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; margin-top: 6px;
  }
  .status-menunggu { background: #fdecc8; color: #8a5a00; }
  .status-lunas { background: var(--green-light); color: var(--green); }
  .status-dikirim { background: #e3edfb; color: #1d5aa5; }
  .status-selesai { background: #eee; color: #555; }
  .item-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .empty { color: var(--text-muted); text-align: center; padding: 20px; }
  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { color: var(--amber); font-size: 14px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Lacak pesanan</h1>
  <p>Masukkan nomor pesanan atau nomor HP kamu</p>
</header>

<main>
  <div class="card">
    <label for="query">Nomor pesanan atau nomor HP</label>
    <input type="text" id="query" placeholder="Contoh: EGG250807143210 atau 08xxxxxxxxxx">
    <button class="btn-submit" onclick="cekStatus()">Cek status</button>
  </div>

  <div id="hasil"></div>

  <div class="back-link">
    <a href="index.html">Kembali ke halaman pesan</a>
  </div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyEi_QC10g-LSxQXcV4X4iZjTvMOu70Tz6BdQ3g9kND1ZohSJz62uCJJ0JVm0aBHB_aTw/exec";

function statusClass(status) {
  if (status === "Lunas") return "status-lunas";
  if (status === "Dikirim") return "status-dikirim";
  if (status === "Selesai") return "status-selesai";
  return "status-menunggu";
}

async function cekStatus() {
  const query = document.getElementById("query").value.trim();
  const hasil = document.getElementById("hasil");
  if (!query) {
    alert("Masukkan nomor pesanan atau nomor HP dulu ya.");
    return;
  }
  hasil.innerHTML = '<div class="empty">Mencari...</div>';

  try {
    const res = await fetch(API_URL + "?action=getOrderStatus&query=" + encodeURIComponent(query));
    const data = await res.json();

    if (data.error) {
      hasil.innerHTML = '<div class="empty">Pesanan tidak ditemukan. Periksa lagi nomornya.</div>';
      return;
    }

    hasil.innerHTML = data.pesanan.map(p => {
      const items = p.items.map(i =>
        `<div class="item-row"><span>${i.nama} x${i.jumlah}</span><span>Rp ${Number(i.harga * i.jumlah).toLocaleString("id-ID")}</span></div>`
      ).join("");
      return `
        <div class="card hasil-card">
          <p style="margin:0 0 4px;font-size:13px;color:#7a6f5f;">${p.id} - ${p.tanggal}</p>
          <span class="status-pill ${statusClass(p.status)}">${p.status}</span>
          <div style="margin-top:12px;border-top:1px solid #eee;padding-top:10px;">${items}</div>
          <div class="item-row" style="font-weight:600;border-top:1px solid #eee;margin-top:6px;padding-top:8px;">
            <span>Total</span><span>Rp ${Number(p.total).toLocaleString("id-ID")}</span>
          </div>
        </div>
      `;
    }).join("");
  } catch (err) {
    hasil.innerHTML = '<div class="empty">Gagal memuat. Periksa koneksi internet.</div>';
  }
}
</script>

</body>
</html>
